[project]
name = "openalice"
version = "0.1.0"
description = "A private Yandex Alice voice bridge for OpenClaw"
authors = [
    {name = "asmoorr",email = "90kidex90@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp (>=3.12,<4.0)",
    "fastapi (>=0.116,<1.0)",
    "httpx>=0.28,<1.0",
    "pydantic-settings (>=2.10,<3.0)",
    "uvicorn[standard]>=0.35,<1.0",
    "ya-passport-auth>=2.0,<3.0",
    "zeroconf>=0.147,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.test-tmp -p no:cacheprovider"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
files = ["openalice"]
check_untyped_defs = true
strict = true

[tool.coverage.run]
branch = true
source = ["openalice"]

[tool.coverage.report]
fail_under = 90
show_missing = true


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
